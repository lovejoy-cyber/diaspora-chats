# This is a SEPARATE Cloudflare Worker, deployed independently from your main Pages
# project — this is a genuine, honest architectural difference from Netlify, not
# something I can smooth over. Cloudflare Pages Functions only run in response to an
# HTTP request; they have no equivalent to Netlify's "Scheduled Functions." Real
# scheduled/cron execution on Cloudflare is a Workers feature (Cron Triggers), which
# requires its own wrangler.toml and its own `npx wrangler deploy` — a second, separate
# deployment alongside your Pages site, not something that lives inside the Pages project.

name = "diasporalink-fetch-reels"
main = "src/index.js"
compatibility_date = "2024-09-01"

# Runs every 3 hours — recalculated after adding 2 new categories (9 total now, up
# from 7). At 9 categories x ~100 units = ~900 units/run, every 2 hours would be
# 12 runs/day = 10,800 units/day, which EXCEEDS the 10,000/day free quota — caught
# this before shipping it. Every 3 hours = 8 runs/day = 7,200 units/day, safely
# within budget with real margin to spare.
[triggers]
crons = ["0 */3 * * *"]
